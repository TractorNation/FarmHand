[package]
name = "Farmhand"
version = "2026.3.1"
description = "A FIRST Robotics Competition scouting application."
authors = ["Henry Mullin", "Jacob Evenson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "farmhand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
base64 = "0.22.1"
tauri-plugin-clipboard-manager = "2"
md5 = "0.8.0"
flate2 = "1.1.5"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls"] }
chrono = "0.4.42"
qrcode = "0.14.1"

# WebKitGTK is already in the tree as a transitive dependency of tauri/wry; naming it
# directly is what lets `lib.rs` reach the webview and turn on media access, which is
# off by default on Linux. Must resolve to the same crate version tauri uses, or
# `PlatformWebview::inner()` hands back a `WebView` from a different crate instance.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[dev-dependencies]
# Filesystem tests need a real directory that cleans itself up; the delete and
# image-import paths are all about how they behave against actual files.
tempfile = "3"

[package.metadata.bundle]
identifier = "com.tractortechs.farmhand"
